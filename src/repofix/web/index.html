<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoFix — Coding Agent</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: 14px; line-height: 1.6;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); font-weight: 600; }
  header span { color: var(--dim); font-size: 12px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  textarea { min-height: 72px; resize: vertical; }
  input[type=number] {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  input:focus, textarea:focus, input[type=number]:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px; background: #238636; color: #fff; border: none;
    border-radius: 6px; padding: 8px 20px; font-family: var(--mono);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #1f6feb40; color: var(--dim); cursor: not-allowed; }
  button:hover:not(:disabled) { background: #2ea043; }
  .switch-label { display: flex; align-items: center; gap: 8px; margin: 14px 0 0;
    font-size: 13px; color: var(--fg); cursor: pointer; }
  .switch-label input { width: auto; cursor: pointer; }
  .status-line { margin-top: 12px; color: var(--dim); font-size: 12px; min-height: 18px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.run { background: var(--yellow); animation: pulse 1.2s infinite; }
  .dot.ok { background: var(--green); }
  .dot.err { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  #stream {
    background: #010409; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; min-height: 200px; max-height: 480px;
    overflow-y: auto; font-size: 13px; white-space: pre-wrap;
  }
  .ev { padding: 1px 0; }
  .ev .seq { color: #484f58; }
  .ev .tag { display: inline-block; min-width: 150px; font-weight: 600; }
  .tag.model_requested, .tag.model_responded { color: var(--accent); }
  .tag.tool_started, .tag.tool_finished { color: var(--purple); }
  .tag.verification_finished { color: var(--yellow); }
  .tag.run_finished, .tag.review_finished { color: var(--green); }
  .tag.preflight_completed { color: var(--green); }
  .ev .detail { color: var(--dim); }
  .ev .actor-reviewer { color: var(--purple); }
  #result { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .stat .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .v.ok { color: var(--green); } .v.bad { color: var(--red); }
  pre#patch {
    background: #010409; border: 1px solid var(--border); border-radius: 4px;
    padding: 12px; overflow-x: auto; font-size: 12px; max-height: 320px; overflow-y: auto;
  }
  .add { color: var(--green); } .del { color: var(--red); }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>RepoFix</h1>
  <span>Repository-Aware Coding Agent Harness</span>
</header>
<div class="wrap">
  <div class="panel">
    <label>仓库路径（本地 Git 仓库文件夹）</label>
    <input type="text" id="repo" placeholder=".\demo-repo">
    <label>任务描述（发给 Agent 的指令）</label>
    <textarea id="task" placeholder="Fix the password validation bug in auth.py ..."></textarea>
    <div class="row">
      <div>
        <label>验证命令（判定修复是否成功的测试）</label>
        <input type="text" id="testcmd" value="python -m pytest -q --tb=no -rf">
      </div>
      <div>
        <label>模型调用上限（防烧钱）</label>
        <input type="number" id="maxcalls" value="6" min="1" max="50">
      </div>
    </div>
    <label class="switch-label">
      <input type="checkbox" id="review">
      启用审查 Agent（修完后由第二个只读 Agent 审查 Patch）
    </label>
    <button id="btn" onclick="startRun()">▶ 运行</button>
    <div class="status-line" id="statusline"></div>
  </div>

  <div class="panel" id="streamPanel" style="display:none">
    <label>执行事件流</label>
    <div id="stream"></div>
  </div>

  <div class="panel" id="result">
    <label>运行结果</label>
    <div class="grid" id="stats"></div>
    <label style="margin-top:14px">changes.patch</label>
    <pre id="patch"></pre>
  </div>
</div>

<script>
"use strict";
// 事件类型 → 展示标签
const TAGS = {
  run_started: "run started", preflight_completed: "preflight ✓",
  model_requested: "→ model", model_responded: "← model",
  model_retry: "model retry",
  tool_started: "tool started", tool_finished: "tool finished",
  verification_finished: "verification", review_started: "review started",
  review_finished: "review finished", run_finished: "run finished",
  context_budget_exceeded: "context budget",
};

function el(id) { return document.getElementById(id); }

// 评审 P0-2：statusline 用 textContent，不拼 innerHTML
function setStatus(cls, text) {
  const line = el("statusline");
  line.textContent = "";
  const dot = document.createElement("span");
  dot.className = "dot " + cls;
  line.append(dot, text);
}

function summarize(payload) {
  if (payload.tool_name) {
    const rc = payload.exit_code !== undefined && payload.exit_code !== null
      ? " exit=" + payload.exit_code : "";
    const st = payload.status ? " [" + payload.status + "]" : "";
    return payload.tool_name + rc + st;
  }
  if (payload.status) return payload.status;
  if (payload.termination_reason) return payload.termination_reason;
  if (payload.detail) return payload.detail;
  return "";
}

// 评审 P0-2：事件 detail 来自工具输出/错误文本（不可信）——
// 用 textContent 构建节点，绝不经 innerHTML 拼接，防止恶意 HTML 执行
function renderEvent(ev) {
  const tag = TAGS[ev.type] || ev.type;
  const actor = ev.actor === "reviewer" ? " reviewer" : "";
  const detail = summarize(ev.payload);
  const div = document.createElement("div");
  div.className = "ev";
  const seqSpan = document.createElement("span");
  seqSpan.className = "seq";
  seqSpan.textContent = "#" + String(ev.seq).padStart(3, "0");
  const tagSpan = document.createElement("span");
  tagSpan.className = "tag " + ev.type;
  tagSpan.textContent = tag;
  const actorSpan = document.createElement("span");
  actorSpan.className = "actor-reviewer";
  actorSpan.textContent = actor;
  const detailSpan = document.createElement("span");
  detailSpan.className = "detail";
  detailSpan.textContent = detail;
  div.append(seqSpan, " ", tagSpan, " ", actorSpan, " ", detailSpan);
  const box = el("stream");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function startRun() {
  const payload = {
    repo: el("repo").value.trim(),
    task: el("task").value.trim(),
    test_command: el("testcmd").value.trim() || null,
    max_model_calls: parseInt(el("maxcalls").value, 10) || 6,
    review: el("review").checked,
  };
  if (!payload.repo || !payload.task) {
    setStatus("err", "仓库路径与任务描述为必填");
    return;
  }
  el("btn").disabled = true;
  el("stream").textContent = "";
  el("streamPanel").style.display = "";
  el("result").style.display = "none";
  setStatus("run", "启动 Run ...");
  fetch("/api/runs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).then(r => r.json()).then(start => {
    setStatus("run", "Run " + start.run_id + " 执行中 ...");
    subscribe(start.run_id);
  }).catch(e => {
    setStatus("err", "启动失败: " + e);
    el("btn").disabled = false;
  });
}

// 评审 P1：SSE 断开时提示并自动重连（EventSource 原生重试），
// 重试超限后查询状态兜底——避免按钮永远禁用
function subscribe(runId) {
  let reconnects = 0;
  const es = new EventSource("/api/runs/" + runId + "/events");
  es.onmessage = (msg) => {
    reconnects = 0;
    const ev = JSON.parse(msg.data);
    if (ev.type === "done") { es.close(); onDone(runId, ev); return; }
    renderEvent(ev);
    if (ev.type === "run_finished") setStatus("run", "生成结果 ...");
  };
  es.onerror = () => {
    reconnects += 1;
    setStatus("run", "连接中断，自动重连中 (" + reconnects + ") ...");
    if (reconnects >= 5) {
      es.close();
      fetch("/api/runs/" + runId).then(x => x.json()).then(st => {
        if (st.status === "completed" || st.status === "failed" || st.status === "budget_exceeded") {
          // Run 已结束只是流断了——直接拉结果
          onDone(runId, { status: st.status, error: st.error });
        } else {
          setStatus("err", "事件流连接失败（已重试 5 次）——Run 可能仍在执行，刷新页面查看");
          el("btn").disabled = false;
        }
      });
    }
  };
}

function statCard(k, v, cls) {
  const card = document.createElement("div");
  card.className = "stat";
  const key = document.createElement("div");
  key.className = "k";
  key.textContent = k;
  const val = document.createElement("div");
  val.className = "v " + (cls || "");
  val.textContent = v;
  card.append(key, val);
  return card;
}

async function onDone(runId, doneEv) {
  const okRun = doneEv.status === "completed";
  const failedRun = doneEv.status === "failed" || doneEv.status === "budget_exceeded";
  setStatus(failedRun ? "err" : "ok",
    okRun ? "运行完成（可见验证通过）"
    : failedRun ? "运行失败: " + (doneEv.error || doneEv.status)
    : "运行结束: " + doneEv.status);
  const r = await fetch("/api/runs/" + runId).then(x => x.json());
  el("btn").disabled = false;
  if (!r.result) return;
  const res = r.result;
  const vOk = res.verification_status === "passed";
  // 结果统计值来自固定枚举/数字（RunResult 契约），用 textContent 构建
  const stats = el("stats");
  stats.textContent = "";
  stats.append(
    statCard("Runtime", res.runtime_status, res.runtime_status === "completed" ? "ok" : "bad"),
    statCard("验证", res.verification_status, vOk ? "ok" : "bad"),
    statCard("修改文件", res.modified_files.length),
    statCard("模型调用", res.model_calls),
    statCard("工具调用", res.tool_calls),
    statCard("Tokens", res.token_usage.total || 0),
    statCard("Review", res.review_status || "-"),
  );
  try {
    const patch = await fetch("/api/runs/" + runId + "/patch").then(x => x.text());
    const box = el("patch");
    box.textContent = "";
    for (const line of patch.split("\n")) {
      const row = document.createElement("span");
      row.className = line.startsWith("+") ? "add" : (line.startsWith("-") ? "del" : "");
      row.textContent = line + "\n";
      box.appendChild(row);
    }
  } catch (e) {
    el("patch").textContent = "(patch 不可用)";
  }
  el("result").style.display = "";
}
</script>
</body>
</html>
